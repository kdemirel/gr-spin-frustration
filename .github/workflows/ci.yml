name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Smoke test of the complete simulation plan
        run: |
          grspin plan run all --smoke --root "$RUNNER_TEMP/smoke" -j 2 --quiet
          grspin plan status --smoke --root "$RUNNER_TEMP/smoke"
          grspin plan analyze --smoke --root "$RUNNER_TEMP/smoke" --n-boot 10
